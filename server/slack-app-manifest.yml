display_information:
  name: Vestov Project Updates
  description: Project status, stakeholder attention, and Slack-to-ClickUp request tracking.
  background_color: "#4f46e5"
features:
  bot_user:
    display_name: Vestov Project Updates
    always_online: false
  slash_commands:
    - command: /project
      url: https://YOUR_PUBLIC_DOMAIN/api/project-bot/slack/commands
      description: Get the latest ClickUp-backed project status.
      usage_hint: now | sprint | done | review | remaining | needs-me | blocked | carryover | untracked
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - groups:history
settings:
  event_subscriptions:
    request_url: https://YOUR_PUBLIC_DOMAIN/api/project-bot/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://YOUR_PUBLIC_DOMAIN/api/project-bot/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
