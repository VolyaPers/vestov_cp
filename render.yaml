services:
  - type: web
    name: vestov-api
    runtime: node
    # Reviewed deployment configuration only. Applying it provisions paid compute
    # and a persistent disk; see docs/deployment/render-storage.md before syncing.
    plan: 0.5c-512mb
    numInstances: 1
    disk:
      name: vestov-uploads
      mountPath: /var/data
      sizeGB: 5
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PROJECT_BOT_ENABLED
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
    healthCheckPath: /health
