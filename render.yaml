services:
  - type: web
    name: vestov-api
    env: node
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && (node dist/migrate.js || true) && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /health

